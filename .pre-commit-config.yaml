repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml

- repo: https://github.com/crate-ci/cargo-semver-checks
  rev: v0.15.0
  hooks:
  - id: cargo-check

- repo: local
  hooks:
  - id: cargo-fmt
    name: cargo fmt check
    entry: bash -c 'export PATH="$HOME/.cargo/bin:$PATH" && cd "$(git rev-parse --show-toplevel)" && exec cargo fmt --check'
    language: system
    types: [rust]
    stages: [commit]

  - id: cargo-clippy
    name: cargo clippy lint
    entry: bash -c 'export PATH="$HOME/.cargo/bin:$PATH" && cd "$(git rev-parse --show-toplevel)" && exec cargo clippy --all-targets -- -D warnings'
    language: system
    types: [rust]
    stages: [commit]

  - id: cargo-test
    name: cargo test
    entry: bash -c 'export PATH="$HOME/.cargo/bin:$PATH" && cd "$(git rev-parse --show-toplevel)" && exec cargo test --all-targets'
    language: system
    types: [rust]
    stages: [push]
