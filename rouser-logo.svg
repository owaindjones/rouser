<?xml version="1.0" encoding="UTF-8"?>
<!-- rouser — System Metrics Daemon Logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <title>rouser</title>
  <desc>A Linux daemon that monitors system metrics and inhibits sleep when activity thresholds are exceeded.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="200" rx="16" fill="#0d1117"/>

  <!-- Icon area: eye / radar circle on the left -->
  <g transform="translate(95, 100)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#1a3a4a" stroke-width="3" opacity="0.5"/>

    <!-- Main eye shape - outer ellipse -->
    <ellipse cx="0" cy="0" rx="58" ry="38" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9"/>

    <!-- Inner iris ring -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>

    <!-- Pupil / center dot -->
    <circle cx="0" cy="0" r="8" fill="#00d4ff" opacity="0.9"/>

    <!-- Metric bars inside the eye (horizontal equalizer) -->
    <g transform="translate(-20, 16)" opacity="0.8">
      <rect x="0" y="-5" width="3" height="10" rx="1.5" fill="#ff6b35"/>
      <rect x="7" y="-7" width="3" height="14" rx="1.5" fill="#ff6b35" opacity="0.85"/>
      <rect x="14" y="-4" width="3" height="8" rx="1.5" fill="#ff6b35" opacity="0.7"/>
      <rect x="21" y="-9" width="3" height="18" rx="1.5" fill="#ff6b35" opacity="0.6"/>
    </g>

    <!-- Subtle radar sweep arc -->
    <path d="M -48 0 A 48 48 0 0 1 48 0" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.3"/>

    <!-- Active pulse ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ff6b35" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="38; 50; 38" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5; 0.1; 0.5" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Corner accents -->
    <line x1="-68" y1="-28" x2="-72" y2="-28" stroke="#00d4ff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="68" y1="-28" x2="72" y2="-28" stroke="#00d4ff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Right side: subtle metric visualization -->
  <g transform="translate(190, 60)" opacity="0.3">
    <!-- CPU bars -->
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#00d4ff"/>
    <rect x="8" y="20" width="4" height="60" rx="2" fill="#00d4ff"/>
    <rect x="16" y="35" width="4" height="45" rx="2" fill="#00d4ff"/>

    <!-- GPU bars -->
    <rect x="30" y="10" width="4" height="70" rx="2" fill="#ff6b35" opacity="0.8"/>
    <rect x="38" y="25" width="4" height="55" rx="2" fill="#ff6b35" opacity="0.6"/>

    <!-- Network bars -->
    <rect x="52" y="15" width="4" height="65" rx="2" fill="#7c8aff" opacity="0.7"/>
    <rect x="60" y="30" width="4" height="50" rx="2" fill="#7c8aff" opacity="0.5"/>

    <!-- Disk bars -->
    <rect x="74" y="40" width="4" height="40" rx="2" fill="#a0e06b" opacity="0.6"/>
    <rect x="82" y="35" width="4" height="45" rx="2" fill="#a0e06b" opacity="0.4"/>

    <!-- Connection lines -->
    <line x1="0" y1="-5" x2="90" y2="-5" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Brand text: "rouser" in bold, modern typeface -->
  <text x="200" y="118" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-2">rouser</text>

  <!-- Subtitle / tagline -->
  <text x="204" y="152" font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="18" font-weight="400" fill="#6e7681" letter-spacing="3">SYSTEM METRICS DAEMON</text>

  <!-- Subtle bottom accent line -->
  <line x1="200" y1="165" x2="560" y2="165" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
</svg>
